name: dscr-covenant-auditor
description: "Audits Debt Service Coverage Ratio where DSCR is Net Operating Income divided by Annual Debt Service"
version: 1.0.0
input_schema:
  type: object
  properties:
    noi_dollars:
      type: string
      description: "Net Operating Income in dollars"
  required:
    - noi_dollars
implementation:
  type: script
  path: dscr_covenant_auditor.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
